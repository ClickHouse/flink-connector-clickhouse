# Dependabot version updates for the project's dependencies (connector build and examples).
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# The ignore rules below skip only minor and major updates, so patch releases
# (including security fixes) still get PRs.

version: 2
updates:
  # Connector build: root Gradle project with all modules from settings.gradle.kts,
  # plus Gradle plugins and the Gradle wrapper.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Flink versions set the supported range (1.17.2 floor in -1.17 and -table,
      # 2.0.0 default in -2.0.0). Move them on purpose, not through Dependabot.
      - dependency-name: "org.apache.flink:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Tests are built for Scala 2.13 (scalatest_2.13). A Scala minor or major
      # version change breaks binary compatibility.
      - dependency-name: "org.scala-lang:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Maven examples, one standalone project per directory.
  - package-ecosystem: "maven"
    directories:
      - "/examples/maven/*/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      maven-examples:
        patterns: ["*"]
    ignore:
      # flink-v1.7 examples stay on Flink 1.17, flink-v2 examples on the Flink
      # version the -2.0.0 module targets.
      - dependency-name: "org.apache.flink:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # sbt examples, one standalone project per directory.
  - package-ecosystem: "sbt"
    directories:
      - "/examples/sbt/*/*"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      sbt-examples:
        patterns: ["*"]
    ignore:
      - dependency-name: "org.apache.flink:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Examples are built for Scala 2.12.
      - dependency-name: "org.scala-lang:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
